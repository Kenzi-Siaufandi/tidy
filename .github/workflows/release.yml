name: Release Tidy CLI

# Pushing a v* tag (e.g. v2.2.0) builds the CLI for every platform below
# and attaches the binaries (+ .sha256 checksums) to the GitHub release.
# One job on purpose: the platforms are small static builds that share no
# cross-compile cache, so a matrix only added a race between legs racing to
# create the release. Sequential builds keep the release creation (and its
# generated notes) to exactly one actor.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build tidy CLI for every platform
        env:
          CGO_ENABLED: 0
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi
            out="tidy-${{ github.ref_name }}-${goos}-${goarch}${ext}"
            GOOS="$goos" GOARCH="$goarch" go build -ldflags="-s -w" -o "$out" main.go
            sha256sum "$out" > "$out.sha256"
          done

      - name: Upload binaries and checksums to release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: tidy-${{ github.ref_name }}-*
